name: Build Windows status bar

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile WinForms executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Run offline smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:STATUSBAR_EXE = (Resolve-Path .\dist\SubscriptionStatus.exe).Path
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Smoke\p0-settings.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "p0 smoke failed with exit code $LASTEXITCODE"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Smoke\p1-usage-hub.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "p1 smoke failed with exit code $LASTEXITCODE"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Smoke\p2-launcher.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "p2 smoke failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-codex-statusbar-windows
          path: |
            dist\SubscriptionStatus.exe
            dist\SHA256SUMS.txt
